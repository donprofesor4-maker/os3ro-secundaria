{id:'unesco',institution:'UNESCO',title:'IA generativa en educación',url:'https://www.unesco.org/en/articles/guidance-generative-ai-education-and-research',text:'La guía propone un enfoque centrado en las personas. Advierte sobre privacidad, desigualdad y riesgos para la autonomía. Para la escuela, invita a revisar la utilidad pedagógica y a conservar el criterio humano. Pregunta de análisis: ¿qué condiciones pondrías antes de usar una herramienta con datos de estudiantes?'},

{id:'viral',institution:'Publicación ficticia para analizar',title:'La IA ya resolvió todos los problemas',url:null,text:'“AlphaFold demuestra que todas las enfermedades tienen cura y que la IA nunca se equivoca”. Este mensaje es un ejemplo ficticio de desinformación para la actividad. No ofrece autor, estudio ni evidencia que respalde esas conclusiones.'}

let seq=0,fs=[],clip=null,selected=null,selectedParent=null,stage=0,tick=0,startTick=0,events=[],winZ=10,guide=false;
const SESSION_KEY='aula-os3sec-ia-v2';
let undoStack=[],draftSlides=null,ready=false;
let student={alias:'',group:''},hints=[],sourceReview=null,exported=false;
function snapshot(){return JSON.parse(JSON.stringify({seq,fs,stage,tick,startTick,events,draftSlides,student,hints,sourceReview,exported}));}
function checkpoint(){if(!ready)return;undoStack.push(snapshot());if(undoStack.length>25)undoStack.shift();updateUndo();}
function updateUndo(){const b=$('#undo');if(b)b.disabled=!undoStack.length;}
function persist(){if(!ready)return;try{localStorage.setItem(SESSION_KEY,JSON.stringify(snapshot()));$('#sessionStatus').textContent='Avance guardado en este navegador.';}catch(e){$('#sessionStatus').textContent='No se pudo guardar aquí. Descarga un respaldo desde Entrega.';}}
function restore(data){seq=data.seq||0;fs=data.fs;stage=Number.isInteger(data.stage)?Math.max(0,Math.min(missions.length,data.stage)):0;tick=data.tick||0;startTick=data.startTick||0;events=data.events||[];draftSlides=data.draftSlides||null;student=data.student||{alias:'',group:''};hints=data.hints||[];sourceReview=data.sourceReview||null;exported=!!data.exported;clip=null;selected=null;}
function undoFiles(){if(!undoStack.length)return;restore(undoStack.pop());$('#dialog').hidden=true;$('#context').hidden=true;refreshFiles();renderMission();updateUndo();persist();notify('Último cambio de archivos deshecho. El progreso también se ajustó.');}
const byId=id=>fs.find(x=>x.id===id),children=id=>fs.filter(x=>x.parent===id),assets=id=>art.find(x=>x.id===id);
function add(name,type,parent,extra={}){checkpoint();let f={id:'f'+(++seq),name,type,parent,...extra};fs.push(f);return f}
function path(id){if(id==='root')return 'Escritorio';let f=byId(id);return f?path(f.parent)+' / '+f.name:'Este equipo'}
function notify(msg){const toast=$('#toast');toast.replaceChildren();const mark=document.createElement('span');mark.className='toast-icon';mark.setAttribute('aria-hidden','true');const isFolder=/carpeta|guardad|pegad|movido|copiad|cortad/i.test(msg);mark.innerHTML=isFolder?icons.folder:'<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="m7 12 3 3 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';const text=document.createElement('span');text.textContent=msg;toast.append(mark,text);$('#toast').hidden=false;clearTimeout(notify.timer);notify.timer=setTimeout(()=>$('#toast').hidden=true,3800)}
function record(type,data={}){events.push({type,...data,tick:++tick});check();persist()}
const since=(type,p=()=>true)=>events.some(e=>e.type===type&&p(e));
const clone=x=>JSON.parse(JSON.stringify(x));
const normalize=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim().replace(/\s+/g,' ');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const words=s=>String(s||'').trim().split(/\s+/).filter(Boolean).length;
const folderNamed=(p,n)=>children(p).find(f=>f.type==='folder'&&normalize(f.name)===normalize(n));
const project=()=>folderNamed('docs','Foro IA');
const subfolder=n=>project()&&folderNamed(project().id,n);
const hasImage=(p,id)=>children(p).some(f=>f.type==='image'&&f.art===id);
const searchImages=(site,q)=>art.filter(x=>normalize(q)&&normalize(x.name+' '+x.tags).includes(normalize(q)));
const research=()=>subfolder('Investigacion')&&children(subfolder('Investigacion').id).find(f=>f.type==='text'&&normalize(f.name)==='analisis_ia.txt');
const deck=()=>draftSlides||[];
const findSlide=term=>deck().find(s=>normalize(s.title).includes(term));
const finalFile=()=>subfolder('Entrega')&&children(subfolder('Entrega').id).find(f=>f.type==='slides'&&f.slides?.length>=9&&f.slides.length<=12);
const topics=['que es','desarrollo','aplicaciones','beneficios','riesgos','exito','fallo','responsable','conclusion','fuentes'];
const titlesOK=()=>topics.every(t=>findSlide(t));
const layoutOK=d=>d.length>=10&&d.every(s=>s.font&&s.size>=20&&s.size<=30&&s.color&&contrast(s.bg,s.color)>=4.5)&&new Set(d.map(s=>s.font)).size<=2&&new Set(d.map(s=>s.bg)).size<=3;
const textOK=d=>d.length>=10&&d.every((s,i)=>words(s.text)>=(i===0?2:8)&&words(s.text)<=(normalize(s.title).includes('fuentes')?160:65));
const slideText=(term,min=12,max=65)=>{const s=findSlide(term);return !!s&&words(s.text)>=min&&words(s.text)<=max;};

function identityMissionStatus(){
 const first=deck()[0]||{},body=String(first.text||''),all=normalize((first.title||'')+' '+body);
 const compact=v=>normalize(v).replace(/\b(?:tercero|tercer|3ro|3er|3ero)\b/g,'3').replace(/[^a-z0-9]/g,'');
 const alias=normalize(student.alias),group=compact(student.group);
 const aliasOK=!!alias&&all.includes(alias);
 const groupOK=!!group&&compact(all).includes(group);
 let explanation=normalize(body);
 if(alias)explanation=explanation.split(alias).join(' ');
 if(normalize(student.group))explanation=explanation.split(normalize(student.group)).join(' ');
 explanation=explanation.replace(/\b(?:alias|grupo|grado|nombre|alumno|alumna|secundaria|tercero|tercer|3ro|3er|3ero)\b/g,' ').replace(/\b\d+\s*[.º°ª-]*\s*[a-z]?\b/g,' ');
 const explanationOK=(explanation.match(/[a-z]+/g)||[]).length>=4;
 return {aliasOK,groupOK,explanationOK,passed:aliasOK&&groupOK&&explanationOK};
}
function identityMissionFeedback(){const v=identityMissionStatus();return '<small class="hint" style="display:block;margin-top:7px">'+(v.aliasOK?'✓':'Falta')+' Alias: '+esc(student.alias)+' · '+(v.groupOK?'✓':'Falta')+' Grupo: '+esc(student.group)+' · '+(v.explanationOK?'✓ Explicación incluida':'Falta una explicación de al menos 4 palabras en el texto de la diapositiva')+'</small>';}


function presentationFilename(name){return String(name||'').trim().replace(/(?:\s*\.\s*aula)+\s*$/ig,'').trim()+'.aula';}
function isDraftFilename(name){return normalize(presentationFilename(name)).replace(/[\s_-]+/g,'')==='borradoria.aula';}
function draftMissionFile(){const folder=project();return folder&&children(folder.id).find(f=>f.type==='slides'&&isDraftFilename(f.name)&&Array.isArray(f.slides)&&f.slides.length>0);}
function draftMissionFeedback(){const f=draftMissionFile();if(f)return '<small class="hint" style="display:block;margin-top:7px">✓ Borrador guardado en Documentos / Foro IA.</small>';const saved=fs.filter(f=>f.type==='slides').slice(-1)[0];return '<small class="hint" style="display:block;margin-top:7px">'+(saved?'Último archivo: '+esc(saved.name)+' · Carpeta: '+esc(path(saved.parent))+'. ':'')+'Se necesita Borrador_IA.aula dentro de Documentos / Foro IA. La extensión .aula se agrega automáticamente.</small>';}


function developmentMissionStatus(){const candidates=deck().map((slide,index)=>({slide,index,count:words(slide.text)})).filter(x=>normalize(x.slide.title).includes('desarrollo'));const valid=candidates.find(x=>x.count>=15&&x.count<=28);const found=valid||candidates.sort((a,b)=>Math.max(15-a.count,a.count-28,0)-Math.max(15-b.count,b.count-28,0))[0];return {found,passed:!!valid};}
function developmentMissionFeedback(){const {found}=developmentMissionStatus();if(!found)return '<small class="hint" style="display:block;margin-top:7px">Falta una diapositiva con el título Desarrollo. Escribe ese título arriba y tu explicación en el cuadro de texto inferior.</small>';const count=found.count;const message=count<15?'Faltan '+(15-count)+' palabras para llegar al mínimo.':count>28?'Sobran '+(count-28)+' palabras: resume el texto hasta un máximo de 28.':'✓ Texto completo.';return '<small class="hint" style="display:block;margin-top:7px">Diapositiva '+(found.index+1)+' · '+esc(found.slide.title)+' · <b>'+count+' / 15–28 palabras</b>. '+message+' No necesitas guardar para comprobar este paso.</small>';}

const missions=[
{title:'Abre Documentos',txt:'Haz doble clic en <b>Explorador</b>. Después abre la carpeta <b>Documentos</b> con doble clic.',test:()=>(since('folder',e=>e.id==='docs')),hint:'Abre el Explorador del escritorio y después Documentos. No basta seleccionar la carpeta.'},
{title:'Crea la carpeta del proyecto',txt:'Dentro de Documentos, pulsa <b>Nueva carpeta</b>. Escribe <b>Foro IA</b> y guarda.',test:()=>(!!project()),hint:'Comprueba que Foro IA quede dentro de Documentos.'},
{title:'Crea Investigación',txt:'Abre <b>Foro IA</b> y crea dentro una carpeta llamada <b>Investigacion</b>.',test:()=>(!!subfolder('Investigacion')),hint:'Entra en Foro IA con doble clic antes de crear la carpeta.'},

{title:'Abre las fuentes',txt:'Haz doble clic en <b>Navegador Aula</b>. Lee las fichas de <b>Fuentes</b>: UNESCO, AlphaFold y Universidad de Oxford.',test:()=>(since('browser')),hint:'Abre el navegador del escritorio. Puedes consultar los enlaces originales en otra pestaña.'},
{title:'Detecta la información falsa',txt:'En Navegador Aula, entra en <b>Control de fuentes</b>. Selecciona la afirmación engañosa, escribe una justificación de <b>unas 20 palabras (se aceptan desde 18)</b> y pulsa Comprobar análisis.',test:()=>(!!sourceReview?.passed),hint:'Compara las afirmaciones con las fichas de Fuentes. Distingue un resultado científico de una promesa absoluta.'},
{title:'Crea el documento de investigación',txt:'Abre <b>Investigación</b> desde el escritorio. Escribe los apartados <b>Objetivo</b> y <b>Público</b>, explica para qué harás la presentación y a quién va dirigida. Usa al menos <b>40 palabras</b>. Guarda como <b>Analisis_IA.txt</b> en <b>Foro IA / Investigacion</b>.',test:()=>(!!research()&&words(research().text)>=40&&['objetivo','publico'].every(t=>normalize(research().text).includes(t))),hint:'Pulsa Guardar como, abre Documentos, Foro IA e Investigacion. Escribe el nombre indicado y guarda.'},

{title:'Copia los archivos al proyecto',txt:'En Explorador / Imágenes, copia las dos ilustraciones y pégalas en <b>Documentos / Foro IA / Recursos</b>. Conserva también los originales en Imágenes.',test:()=>(!!subfolder('Recursos')&&['datos','ciencia'].every(id=>hasImage('pictures',id)&&hasImage(subfolder('Recursos').id,id))),hint:'Botón derecho en cada imagen → Copiar. Abre Recursos y pulsa Pegar. Repite para la segunda imagen.'},

{title:'Añade las secciones',txt:'Pulsa <b>Nueva diapositiva</b> hasta tener <b>10 diapositivas</b>. Titula las otras nueve: <b>Desarrollo, Aplicaciones, Beneficios, Riesgos, Éxito, Fallo, Uso responsable, Conclusión y Fuentes</b>.',test:()=>(deck().length===10&&titlesOK()),hint:'Selecciona cada miniatura y escribe su título. El botón derecho permite eliminar o mover una diapositiva.'},

function imageMissionFeedback(){const slides=deck(),items=slides.map((slide,i)=>{if(!slide.images.length)return '';const pending=[];if(slide.layout!=='split')pending.push('elige Texto e imagen');if(slide.images.some(im=>im.width<15||im.width>38))pending.push('ajusta el tamaño');if(slide.images.some(im=>im.x<52||im.x+im.width>98||im.y<30||im.y+im.width*4/3>94))pending.push('acomoda a la derecha');return '<li>'+esc(slide.title||'Diapositiva '+(i+1))+': '+(pending.length?pending.join('; '):'lista ✓')+'</li>';}).filter(Boolean);if(items.length<4)items.push('<li>Faltan imágenes: debe haber una en cuatro diapositivas.</li>');return '<ul>'+items.join('')+'</ul>';}
function renderMission(){$('#level').textContent=stage<missions.length?'MISIÓN '+(stage+1)+' / '+missions.length:'ACREDITADO · 35 / 35';$('#instruction').innerHTML=stage<missions.length?'<strong>'+missions[stage].title+'</strong><br>'+missions[stage].txt+flexibleMissionFeedback():'<b>¡Actividad acreditada!</b> Completaste las 35 misiones del OS de tercero de secundaria. Descarga tu informe de acreditación y conserva tu respaldo.';}

function links(t){return new Set((String(t||'').match(/https:\/\/[^\s<>]+/g)||[])).size;}
function contrast(a,b){const lum=x=>{const v=x.replace('#','').match(/../g).map(c=>parseInt(c,16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return v[0]*.2126+v[1]*.7152+v[2]*.0722;};const x=lum(a||'#ffffff'),y=lum(b||'#19344e');return (Math.max(x,y)+.05)/(Math.min(x,y)+.05);}
function audit(d){const a=[];if(d.length<10||d.length>12)a.push('La presentación debe tener de 10 a 12 diapositivas.');if(!layoutOK(d))a.push('Unifica fuentes y fondos; revisa tamaño y contraste de todo el documento.');if(!textOK(d))a.push('Revisa los límites de palabras en cada diapositiva.');d.forEach((s,i)=>{if(!s.title.trim())a.push('Diapositiva '+(i+1)+': falta título.');if(s.images.some(im=>im.x<52||im.y<30||im.x+im.width>98||im.y+im.width*4/3>94))a.push('Diapositiva '+(i+1)+': mueve la imagen a la zona derecha sin salir del lienzo.');if(s.images.length&&s.layout==='wide')a.push('Diapositiva '+(i+1)+': usa el diseño Texto e imagen para separar los elementos.');if(s.images.length>1)a.push('Diapositiva '+(i+1)+': conserva una imagen y distribuye las demás.');if((s.table||s.diagram)&&words(s.text)>28)a.push('Diapositiva '+(i+1)+': limita el texto a 28 palabras para dejar espacio a la tabla o diagrama.');if(s.table&&s.diagram)a.push('Diapositiva '+(i+1)+': usa tabla o diagrama, no ambos.');if((s.table||s.diagram)&&s.images.length)a.push('Diapositiva '+(i+1)+': separa las imágenes de la tabla o diagrama.');if(!s.transition||s.transition==='none')a.push('Diapositiva '+(i+1)+': falta transición.');});return a;}

function dialog(title,initial,callback,confirmOnly=false){const d=$('#dialog');d.hidden=false;d.innerHTML='<form class="dialogbox"><h2></h2><input aria-label="Nombre" autocomplete="off"><div class="actions"><button type="button">Cancelar</button><button class="primary">'+(confirmOnly?'Confirmar':'Guardar')+'</button></div></form>';d.querySelector('h2').textContent=title;const input=d.querySelector('input');input.value=initial;input.hidden=confirmOnly;d.querySelector('button').onclick=()=>d.hidden=true;d.querySelector('form').onsubmit=e=>{e.preventDefault();const val=input.value.trim();if(!confirmOnly&&!val)return;d.hidden=true;callback(val)};if(confirmOnly)d.querySelector('.primary').focus();else{input.focus();input.select()}}

function paste(parent){if(!clip)return notify('Selecciona y copia un archivo primero.');const f=clip.art?{name:clip.name,type:'image',art:clip.art,parent:null}:byId(clip.id);if(!f)return; if(f.type==='folder')return notify('En esta práctica copia solamente imágenes y notas.');if(f.parent===parent)return notify('El archivo ya está en esta carpeta.');if(children(parent).some(x=>x.name===f.name))return notify('Ya existe un archivo con ese nombre. No se cuenta otra vez.');const moved=clip.cut;if(moved){checkpoint();f.parent=parent;clip=null}else add(f.name,f.type,parent,{art:f.art,text:f.text,slides:f.slides?JSON.parse(JSON.stringify(f.slides)):undefined});record(moved?'move':'paste',{parent,art:f.art,name:f.name});refreshFiles();notify(moved?'Archivo movido.':'Archivo pegado.')}

function explorer(initial='root'){let current=initial;record('folder',{id:current});const w=openWindow('Explorador de archivos',700,470);w.el.dataset.folder=current;function draw(){if(current!=='root'&&!byId(current))current='root';w.el.dataset.folder=current;w.body.innerHTML='';const bar=document.createElement('div');bar.className='toolbar';bar.innerHTML='<button>←</button><span class="path"></span><button>Nueva carpeta</button><button>Pegar</button>';bar.querySelector('.path').textContent=path(current);bar.children[0].disabled=current==='root';bar.children[0].onclick=()=>{current=byId(current)?.parent||'root';draw()};bar.children[2].onclick=()=>dialog('Nueva carpeta','',name=>{if(children(current).some(x=>x.name===name))return notify('Ese nombre ya existe.');add(name,'folder',current);record('create',{name,parent:current});if(normalize(name)==='proyecto espacial'&&current!=='docs')notify('La carpeta debe estar dentro de Documentos. Abre Documentos y créala ahí.');draw()});bar.children[3].disabled=!clip;bar.children[3].onclick=()=>paste(current);w.body.append(bar);const list=document.createElement('div');list.className='files';list.style.marginTop='12px';for(const f of children(current)){const b=document.createElement('button');b.className='file'+(selected===f.id?' sel':'')+(clip?.cut&&clip.id===f.id?' cut':'');b.innerHTML=f.type==='folder'?icons.folder:f.type==='image'?assets(f.art).svg:f.type==='slides'?icons.slides:icons.note;const label=document.createElement('span');label.textContent=f.name;b.append(label);b.onclick=()=>{selected=f.id;selectedParent=current;document.querySelectorAll('.file.sel').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};b.ondblclick=()=>{if(f.type==='folder'){current=f.id;selected=null;record('folder',{id:current});draw()}else if(f.type==='image')view(f);else if(f.type==='slides')presentation(f);else note(f)};b.oncontextmenu=e=>{selected=f.id;selectedParent=current;menu(e,[['Abrir',()=>f.type==='folder'?(current=f.id,draw()):f.type==='image'?view(f):f.type==='slides'?presentation(f):note(f)],['Copiar',()=>copy(f),f.type==='folder'],['Cortar',()=>copy(f,true),f.type==='folder'],['Renombrar',()=>rename(f),['docs','pictures','downloads'].includes(f.id)]])};list.append(b)}if(!list.children.length)list.innerHTML='<p class="empty">Esta carpeta está vacía.</p>';w.body.append(list);w.body.oncontextmenu=e=>{if(e.target.closest('.file'))return;menu(e,[['Pegar',()=>paste(current),!clip]])};}w.el._render=draw;draw();return w}

function saveImageTo(img,parent,name){
  name=name.trim();if(!name)return notify('Escribe el nombre del archivo.');
  if(!name.toLowerCase().endsWith('.svg'))name+='.svg';
  if(children(parent).some(x=>x.name===name||x.art===img.id)){notify('Esta imagen ya está en esa carpeta.');return false;}
  add(name,'image',parent,{art:img.id});record('download',{art:img.id,site:img.site,parent});refreshFiles();
  notify('Imagen guardada en '+path(parent)+'.');return true;
}
function download(img){
  const overlay=$('#dialog');overlay.hidden=false;
  overlay.innerHTML='<form class="save-dialog" role="dialog" aria-modal="true" aria-label="Guardar imagen como"><div class="save-title">Guardar imagen como…</div><div class="toolbar"><button type="button" class="save-back" aria-label="Subir a carpeta anterior">↑</button><span class="path"></span></div><div class="save-main"><aside><button type="button" class="save-home">Escritorio</button></aside><div class="save-list files" aria-label="Carpetas y archivos"></div></div><div class="save-bottom"><label>Nombre del archivo<input aria-label="Nombre del archivo" class="save-name"></label><p class="hint">Tipo: imagen SVG · Abre las carpetas con doble clic y después pulsa Guardar.</p><div class="actions"><button type="button" class="save-cancel">Cancelar</button><button class="primary">Guardar</button></div></div></form>';
  let folder='root';const name=overlay.querySelector('.save-name');name.value=img.name+'.svg';
  const list=overlay.querySelector('.save-list');
  function draw(){
    overlay.querySelector('.path').textContent=path(folder);
    overlay.querySelector('.save-back').disabled=folder==='root';list.innerHTML='';
    for(const file of children(folder)){
      const entry=document.createElement('button');entry.type='button';entry.className='file';
      entry.innerHTML=file.type==='folder'?icons.folder:file.type==='image'?assets(file.art).svg:icons.note;
      const label=document.createElement('span');label.textContent=file.name;entry.append(label);
      entry.setAttribute('aria-label',file.name+(file.type==='folder'?' · carpeta, doble clic para abrir':''));
      entry.onclick=()=>{list.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));entry.classList.add('sel');};
      function open(){if(file.type==='folder'){folder=file.id;draw();}else{name.value=file.name;}}
      entry.ondblclick=open;entry.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();open();}};
      list.append(entry);
    }
    if(!list.children.length)list.innerHTML='<p class="empty">Esta carpeta está vacía.</p>';
  }
  overlay.querySelector('.save-back').onclick=()=>{folder=byId(folder)?.parent||'root';draw();};
  overlay.querySelector('.save-home').onclick=()=>{folder='root';draw();};
  overlay.querySelector('.save-cancel').onclick=()=>overlay.hidden=true;
  overlay.querySelector('form').onsubmit=e=>{e.preventDefault();if(saveImageTo(img,folder,name.value))overlay.hidden=true;};
  draw();overlay.querySelector('.save-home').focus();
}
